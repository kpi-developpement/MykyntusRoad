server:
  port: ${SERVER_PORT:8334}

spring:
  application:
    name: mykyntus-suivi
  # Local secrets (DB password...) in backend/.env, never committed. In Docker: environment variables.
  config:
    import: "optional:file:.env[.properties],optional:file:backend/.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mykyntus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    # Change in production (min 32 chars) - override with env APP_JWT_SECRET
    secret: ${APP_JWT_SECRET:change-me-mykyntus-dev-secret-key-0123456789}
    expiration-minutes: 720
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3955}
  seed:
    enabled: true
