# MyKyntus Suivi - database + backend + frontend
# The database is created automatically in its own container (mykyntus-suivi-db): nothing to set up on the server.
# The backend creates the tables and the default accounts at startup.
#
#   docker-compose up -d --build        (works without .env; copy .env.example to .env to change secrets)
#
# Frontend : http://10.10.10.25:3955   Backend : http://10.10.10.25:8334
# To use an existing PostgreSQL instead (e.g. 10.10.10.50), set DB_HOST / DB_NAME / DB_USERNAME / DB_PASSWORD in .env.

# "version" 2.4 keeps the file compatible with the old docker-compose 1.x (python) installed on the server
# and with "docker compose" v2. The project name comes from COMPOSE_PROJECT_NAME in .env.
version: "2.4"

services:
  mykyntus-suivi-db:
    image: postgres:17-alpine
    container_name: mykyntus-suivi-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-mykyntus_suivi}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - TZ=Europe/Paris
    volumes:
      - mykyntus-suivi-pgdata:/var/lib/postgresql/data
    # No port published on the server: only the backend reaches the database, through the Docker network,
    # so it can never collide with another PostgreSQL. Console: docker exec -it mykyntus-suivi-db psql -U postgres mykyntus_suivi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mykyntus_suivi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mykyntus-suivi-backend:
    build: ./backend
    image: mykyntus-suivi-backend
    container_name: mykyntus-suivi-backend
    restart: unless-stopped
    depends_on:
      mykyntus-suivi-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-mykyntus-suivi-db}:${DB_PORT:-5432}/${DB_NAME:-mykyntus_suivi}?currentSchema=${DB_SCHEMA:-mykyntus_suivi}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - DB_SCHEMA=${DB_SCHEMA:-mykyntus_suivi}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-change-me-mykyntus-suivi-secret-key-0123456789}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://10.10.10.25:3955}
    ports:
      - "${BACKEND_PORT:-8334}:8334"

  mykyntus-suivi-frontend:
    build:
      context: ./frontend
      args:
        # address of the backend as seen by the users' browsers
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://10.10.10.25:8334}
    image: mykyntus-suivi-frontend
    container_name: mykyntus-suivi-frontend
    restart: unless-stopped
    depends_on:
      - mykyntus-suivi-backend
    ports:
      - "${FRONTEND_PORT:-3955}:3955"

volumes:
  mykyntus-suivi-pgdata:
    name: mykyntus-suivi-pgdata

networks:
  default:
    name: mykyntus-suivi-net
